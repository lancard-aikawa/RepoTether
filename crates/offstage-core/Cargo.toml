[package]
name = "offstage-core"
version = "0.1.0"
description = "Index of files kept outside git, tied to repositories and Claude sessions (see docs/offstage/concept.md)"
authors = ["aikawa"]
edition = "2021"
license = "MIT"
publish = false

# Offstage は通信しないことをコードで保証する。通信するクレートを足すと tests/no_network.rs が落ちる
[dependencies]
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
