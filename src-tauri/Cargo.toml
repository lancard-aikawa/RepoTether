[package]
name = "repotether"
version = "0.2.0"
description = "Repository history, activity and local state across projects"
authors = ["aikawa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repotether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }


# 個人用ツールなので、サイズより再ビルドの速さを取る。
# lto = true / codegen-units = 1 にすると exe は小さくなるが、1 行直すたびの再ビルドが約 6 秒 → 約 2 分になる。
# 人に配るときだけ戻す
[profile.release]
opt-level = 3
panic = "abort"
strip = true
incremental = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
