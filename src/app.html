<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepoTether</title>
    <script>
      // 描画前にテーマを当てる (起動直後に明るい画面が一瞬出ないように)。本体は store の applyTheme
      try {
        const p = JSON.parse(localStorage.getItem("repotether.prefs") || "{}");
        if (p.theme === "light" || p.theme === "dark") document.documentElement.dataset.theme = p.theme;
        if (p.density === "compact") document.documentElement.dataset.density = "compact";
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
